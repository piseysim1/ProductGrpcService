syntax = "proto3";

option csharp_namespace = "ProductGrpcService";

package category;

service CategoryService {
    rpc GetAllCategories (GetAllCategoriesRequest) returns (CategoryListResponse);
    rpc GetCategoryById (CategoryByIdRequest) returns (CategoryResponse);
}

message GetAllCategoriesRequest  
{
}

message CategoryByIdRequest {
    int32 id = 1;
}

message CategoryListResponse {
    repeated CategoryResponse categories = 1;
}

message CategoryResponse {
    int32 id = 1;
    string name = 2;
    string description = 3;
}