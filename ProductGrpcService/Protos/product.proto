syntax = "proto3";

option csharp_namespace = "ProductGrpcService";

package product;

service ProductService {
  rpc GetAllProducts (GetAllProductsRequest) returns (ProductListResponse);
  rpc GetProductById (ProductByIdRequest) returns (ProductResponse);
  rpc AddProducts (AddProduct) returns(ProductResponse);
 rpc UpdateProductResponse(UpdateProductRequest)
    returns (QueueAcceptedResponse);
}
message QueueAcceptedResponse {
    string requestId = 1;
    bool accepted = 2;
    string message = 3;
}
message GetAllProductsRequest 
{	

}

message AddProduct{
	string name = 2;
	string description = 3;
	double price = 4;
	int32 categoryId = 5;		
	int32 inventoryId= 6;
}

message ProductListResponse
{
	repeated ProductResponse product =1; 
}


message ProductByIdRequest {
  int32 id = 1;
}

message ProductResponse{
	int32 id = 1;
	string name = 2;
	string description = 3;
	double price = 4;
	int32 categoryId = 5;		
	int32 inventoryId= 6;
}

message UpdateProductRequest {
	int32 id = 1;
	string name = 2;
	string description = 3;
	double price = 4;
	int32 categoryId = 5;		
	int32 inventoryId= 6;
}