syntax = "proto3";

option csharp_namespace = "ProductGrpcService";

package product;
import "common.proto";
import "category.proto";
import "inventory.proto";

// The greeting service definition.
service ProductService {
  // Sends a greeting
  rpc GetAllProducts (EmptyRequest) returns (ProductListResponse);
  rpc GetProductById (ProductByIdRequest) returns (FullProductDetailsResponse);
}

message ProductListResponse
{
	repeated ProductResponse product =1; 
}

// The request message containing the user's name.

message ProductByIdRequest {
  int32 id = 1;
}

message ProductResponse{
	int32 id = 1;
	string name = 2;
	string description = 3;
	double price = 4;
	int32 categoryId = 5;
}
// response joins Product, Categories, Invertory, and Review  

message FullProductDetailsResponse {
   ProductResponse products =1;
   InventoryResponse inventory = 2;
   CategoryResponse category = 3;
   repeated ReviewResponse reviews = 4;
}

message ReviewResponse {
  int32 id = 1;
  int32 rating = 2;
  string comment = 3;
  string reviewerName = 4;
}
