syntax = "proto3";

option csharp_namespace = "ProductGrpcService";

package inventory;

service InventoryService {
    rpc GetAllInventories (GetAllInventoryRequest) returns (InventoryListResponse);
    rpc GetInventoryById (InventoryByIdRequest) returns (InventoryResponse);
}

message GetAllInventoryRequest  {}

message InventoryByIdRequest {	
    int32 id = 1;
}

message InventoryListResponse {
    repeated InventoryResponse inventory = 1;
}

message InventoryResponse
{
	int32 id =1; 
	int32 productId = 2; 
	int32 stockQuantity = 3; 
	string warehoseLocation =4 ; 

}