
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  transform/es-mapping:
    error_mode: ignore
    log_statements:
      - context: scope
        statements:
          - set(attributes["elastic.mapping.mode"], "none")
    trace_statements:
      - context: scope
        statements:
          - set(attributes["elastic.mapping.mode"], "none")

exporters:
  debug:
    verbosity: detailed

  elasticsearch:
    endpoints:
      - http://elasticsearch:9200
    logs_index: otel-logs
    traces_index: otel-traces

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, transform/es-mapping]
      exporters: [debug, elasticsearch]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [batch, transform/es-mapping]
      exporters: [debug, elasticsearch]
